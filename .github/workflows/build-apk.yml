name: Build APK

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SAR_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SAR-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/SAR-${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SAR-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sar-latest --yes --cleanup-tag || true
          gh release create sar-latest out/*.apk \
            --title "SAR build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Install SAR-${{ github.run_number }}.apk on the phone." \
            --prerelease --target ${{ github.sha }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
